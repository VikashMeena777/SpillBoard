name: CI - Quality & Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Type Check (Strict)
        run: npx tsc --noEmit

      # No longer masked with `|| echo` + continue-on-error: there is a real
      # .eslintrc.json now, so lint failures are genuine signal.
      - name: Linting
        run: npx next lint --dir src

      - name: Unit Tests
        run: npm test

      - name: Verify Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://spillboard.vercel.app"
          NEXT_PUBLIC_SUPABASE_URL: "https://demo.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "demo-key"
