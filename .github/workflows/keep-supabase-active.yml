name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (Supabase free projects pause after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Send Keep-Alive Ping to Supabase REST API
        run: |
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"

          # No hardcoded fallback: the previous version embedded a real
          # project ref in the repo, which leaks the project identifier and
          # pings someone else's project when secrets are absent.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Skipping: NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are not set in repository secrets."
            exit 0
          fi

          echo "Pinging Supabase REST API endpoint at: ${SUPABASE_URL}/rest/v1/"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/confessions?select=id&limit=1" || true)

          echo "Supabase HTTP Response Code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 500 ]; then
            echo "✅ Supabase project successfully pinged! Inactivity timer reset."
          else
            echo "⚠️ Notice: Supabase returned HTTP status $RESPONSE. Project ping sent."
          fi
